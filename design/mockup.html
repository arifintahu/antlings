<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Antlings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark light;
  --bg: #0F172A; --surface: #141E33; --surface2: #1E293B; --line: #26354D; --border: #475569;
  --fg: #F1F5F9; --muted: #94A3B8; --accent: #22C55E; --accent-d: #15803D; --on-accent: #052E16;
  --amber: #F59E0B; --red: #F87171; --blue: #38BDF8;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface2: #EEF2F7; --line: #DCE3EC; --border: #64748B;
    --fg: #0F172A; --muted: #475569; --accent: #15803D; --accent-d: #14532D; --on-accent: #FFFFFF;
    --amber: #B45309; --red: #B91C1C; --blue: #0369A1;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 20px/1.4 "VT323", ui-monospace, "Courier New", monospace; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* controls: flat, few borders */
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; background: var(--surface2); border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { border-color: var(--red); color: var(--red); background: transparent; }
.btn svg, .iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: square; }
.iconbtn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; }
.iconbtn:hover { background: var(--surface2); }
.iconbtn.danger { color: var(--red); }
.link { min-height: 44px; padding: 0 6px; background: none; border: 0; color: var(--muted); }
.link:hover { color: var(--fg); }
.link.accent { color: var(--accent); }

/* status text */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 18px; line-height: 1; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; background: currentColor; flex: none; }
.s-idle { color: var(--muted); }
.s-thinking, .s-tool { color: var(--blue); }
.s-approval { color: var(--amber); }
.s-done { color: var(--accent); }
.s-error { color: var(--red); }
.s-approval::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.s-error::before { transform: rotate(45deg); }
.s-thinking::before { box-shadow: 12px 0 0 currentColor; width: 4px; margin-right: 10px; }

/* sidebar */
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(86vw, 320px); background: var(--surface); border-right: 2px solid var(--line); display: flex; flex-direction: column; transform: translateX(-100%); transition: transform .2s ease-out; padding-top: env(safe-area-inset-top); }
.sidebar.open { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); border: 0; display: none; }
.scrim.show { display: block; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 0; }
.side-head h2 { margin: 0; font-size: 24px; font-weight: 400; }
.filter { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
.seg { display: flex; gap: 14px; }
.seg button { white-space: nowrap; min-height: 44px; padding: 0 2px; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--muted); }
.seg button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.sessions { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; width: 100%; min-height: 64px; padding: 2px 8px 2px 2px; text-align: left; background: transparent; border: 0; }
.row:hover { background: var(--surface2); }
.row[aria-current="true"] { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
.row canvas { width: 64px; height: 56px; image-rendering: pixelated; }
.row .d { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .t { display: block; font-size: 21px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; color: var(--muted); font-size: 18px; }
.side-foot { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); }
.usage { display: flex; flex-direction: column; gap: 4px; }
.lim { display: grid; grid-template-columns: 56px 1fr 38px 44px; gap: 8px; align-items: center; font-size: 18px; line-height: 1.1; }
.lim .lp { text-align: right; }
.lim .lr { color: var(--muted); text-align: right; }
.bar { display: block; height: 10px; border: 2px solid var(--border); background: var(--bg); }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.warn i { background: var(--amber); }
.bar.crit i { background: var(--red); }

/* main */
.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; padding-top: calc(4px + env(safe-area-inset-top)); border-bottom: 2px solid var(--line); }
.topbar h1 { flex: 1; margin: 0 4px; font-size: 22px; font-weight: 400; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar h1 small { color: var(--muted); font-size: 18px; }
.ctxbtn { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; background: transparent; border: 0; font-size: 19px; }
.ctxbtn:hover { background: var(--surface2); }
.ctxbtn .bar { width: 40px; }
.menu, .ctxpanel { position: absolute; z-index: 20; top: 54px; right: 8px; background: var(--surface2); border: 2px solid var(--border); box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.menu[hidden], .ctxpanel[hidden] { display: none; }
.menu { min-width: 190px; display: flex; flex-direction: column; }
.menu button { min-height: 44px; padding: 0 14px; text-align: left; background: transparent; border: 0; border-bottom: 2px solid var(--line); }
.menu button:last-child { border-bottom: 0; }
.menu button.danger { color: var(--red); }
.ctxpanel { width: min(94vw, 340px); padding: 10px 12px; }
.stack { display: flex; height: 14px; border: 2px solid var(--border); background: var(--bg); margin: 8px 0; }
.stack i { display: block; height: 100%; }
.legend { list-style: none; margin: 0; padding: 0; font-size: 18px; }
.legend li { display: flex; gap: 8px; align-items: center; min-height: 26px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; flex: none; border: 2px solid var(--border); }
.legend .v { margin-left: auto; color: var(--muted); }

/* subagents */
.office { background: var(--surface); border-bottom: 2px solid var(--line); }
.ohead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 12px; color: var(--muted); font-size: 18px; }
#summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#team-toggle { flex: none; }
.floor { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 4px 10px; padding: 0 8px 10px; }
.worker { --s: 2; display: none; flex-direction: column; align-items: center; width: 112px; min-height: 44px; padding: 4px 2px; background: transparent; border: 2px solid transparent; text-align: center; }
.worker canvas { width: calc(32px * var(--s)); height: calc(28px * var(--s)); image-rendering: pixelated; }
.worker .nm { display: block; max-width: 100%; margin-top: 2px; font-size: 20px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.worker .act { display: block; max-width: 100%; font-size: 17px; line-height: 1.1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.worker:hover { background: var(--surface2); }
.worker[aria-current="true"] { display: flex; width: auto; min-width: 112px; --s: 3; background: var(--surface2); border-color: var(--accent); }
.office.expanded .worker { display: flex; width: 112px; --s: 2; }
.office.expanded .worker[aria-current="true"] { --s: 2; }
.empty { display: none; align-self: center; max-width: 220px; padding: 6px 8px; font-size: 18px; color: var(--muted); }
.office.expanded .empty { display: block; }

/* conversation + agent detail */
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.chat > * { flex: none; }
.msg { max-width: 62ch; }
.msg.user { align-self: flex-end; padding: 6px 12px; background: var(--surface2); }
.msg .who { display: block; color: var(--muted); font-size: 17px; }
.card { max-width: 70ch; border: 2px solid var(--line); background: var(--surface); }
.card .hd { padding: 2px 10px; color: var(--muted); font-size: 18px; border-bottom: 2px solid var(--line); }
.card pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 19px; }
.card.warn { border-left: 6px solid var(--amber); }
.card.bad { border-left: 6px solid var(--red); }
.card.good { border-left: 6px solid var(--accent); }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 10px; }
.caret::after { content: "_"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.spawn-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; max-width: 70ch; min-height: 44px; padding: 0 12px; text-align: left; background: var(--surface); border: 0; border-left: 4px solid var(--blue); }
.spawn-row:hover { background: var(--surface2); }
.back { align-self: flex-start; min-height: 44px; padding: 0 6px; background: none; border: 0; color: var(--muted); }
.back:hover { color: var(--fg); }
.ahead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.ahead h2 { margin: 0; font-size: 26px; font-weight: 400; }
.ameta { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-size: 18px; }
.log { list-style: none; margin: 0; padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.log li { display: flex; gap: 8px; align-items: baseline; font-size: 19px; min-height: 26px; }
.log li b { font-weight: 400; color: var(--blue); }
.log li span { overflow-wrap: anywhere; }
.dot { flex: none; width: 10px; height: 10px; background: var(--muted); align-self: center; }
.dot.ok { background: var(--accent); }
.dot.run { background: var(--blue); animation: blink 1s steps(2) infinite; }
.dot.ask { background: var(--amber); }
.dot.fail { background: var(--red); transform: rotate(45deg); }
.chat details summary { min-height: 44px; display: flex; align-items: center; color: var(--muted); cursor: pointer; }
.chat details pre { margin: 0 0 6px; font: inherit; font-size: 18px; white-space: pre-wrap; color: var(--muted); }
.composer { display: flex; gap: 8px; padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 120px; resize: none; padding: 8px 10px; font: inherit; font-size: 20px; color: var(--fg); background: var(--surface); border: 2px solid var(--border); }
.composer textarea::placeholder { color: var(--muted); }

/* dialogs */
dialog { color: var(--fg); background: var(--surface2); border: 3px solid var(--border); padding: 16px; max-width: min(92vw, 440px); font: inherit; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { margin: 0 0 6px; font-size: 24px; font-weight: 400; }
dialog p { margin: 0; }
dialog .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
dialog .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
dialog .chips button { min-height: 44px; padding: 0 12px; background: var(--bg); border: 2px solid currentColor; }


dialog { width: min(92vw, 440px); max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.field > label, .field > .lbl { color: var(--muted); font-size: 18px; }
.pathbox { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-align: left; background: var(--bg); border: 2px solid var(--border); }
.pathbox span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent { display: flex; flex-direction: column; margin-top: 2px; }
.recent button { min-height: 44px; padding: 0 12px; text-align: left; background: transparent; border: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent button:hover { background: var(--bg); color: var(--fg); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
select, dialog input { width: 100%; min-height: 44px; padding: 0 10px; font: inherit; font-size: 20px; color: var(--fg); background: var(--bg); border: 2px solid var(--border); border-radius: 0; }
.hint { min-height: 24px; margin-top: 8px; color: var(--muted); font-size: 18px; line-height: 1.2; }
.hint.warn { color: var(--amber); }
.pathline { margin: 4px 0 6px; color: var(--muted); }
.flist { max-height: 38vh; max-height: 38dvh; overflow-y: auto; border: 2px solid var(--line); background: var(--bg); }
.frow { display: block; width: 100%; min-height: 44px; padding: 0 12px; text-align: left; background: transparent; border: 0; border-bottom: 2px solid var(--line); }
.frow:hover { background: var(--surface2); }
.frow:last-child { border-bottom: 0; }
.mkrow { display: flex; gap: 8px; margin-top: 8px; }


.app[hidden] { display: none; }
.login { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); background: var(--bg); overflow-y: auto; }
.login[hidden] { display: none; }
.login-card { width: min(100%, 360px); margin: auto; display: flex; flex-direction: column; gap: 12px; }
.login-ant { display: flex; justify-content: center; }
.login-ant canvas { width: 192px; height: 168px; image-rendering: pixelated; }
.login h1 { margin: 0; text-align: center; font-size: 34px; font-weight: 400; letter-spacing: 1px; }
.login .sub { margin: 0; text-align: center; color: var(--muted); }
.login .foot { text-align: center; color: var(--muted); font-size: 17px; line-height: 1.2; }
.btn.wide { width: 100%; }
.login .link { text-align: center; width: 100%; }
.login label, #stepdlg label { color: var(--muted); font-size: 18px; }
.login .fld { display: flex; flex-direction: column; gap: 4px; }
.pwrow { display: flex; gap: 8px; }
.pwrow input { flex: 1; min-width: 0; }
.login input, #stepdlg input { width: 100%; min-height: 44px; padding: 0 10px; font: inherit; font-size: 20px; color: var(--fg); background: var(--surface); border: 2px solid var(--border); border-radius: 0; }
.login .code, #stepdlg .code { letter-spacing: .4em; text-align: center; font-size: 26px; }
.lg-msg { min-height: 26px; text-align: center; color: var(--muted); }
.lg-msg.err { color: var(--red); }
.foot-links { display: flex; justify-content: space-between; }
#stepdlg .btn.wide { margin-top: 10px; }
@media (max-height: 700px) { .login-ant canvas { width: 128px; height: 112px; } .login h1 { font-size: 28px; } }


.sec { position: fixed; inset: 0; z-index: 90; background: var(--bg); overflow-y: auto; }
.sec[hidden] { display: none; }
.sec-wrap { max-width: 640px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
.sec h1 { margin: 4px 0 8px; font-size: 32px; font-weight: 400; }
.sec h2 { margin: 24px 0 4px; font-size: 22px; font-weight: 400; color: var(--muted); }
.sec p { margin: 0 0 8px; color: var(--muted); }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 2px solid var(--line); min-height: 56px; }
.srow .t { overflow-wrap: anywhere; }
.srow .m { color: var(--muted); font-size: 18px; line-height: 1.2; }
.srow .tag { margin-left: 8px; font-size: 17px; color: var(--accent); }
.sec .btn { flex: none; }
.sec .add { margin-top: 12px; }
.cmd { display: block; margin: 8px 0; padding: 8px 10px; overflow-x: auto; white-space: pre; background: var(--surface); border: 2px solid var(--line); font: inherit; font-size: 19px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.opt input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); }
.opt select { width: auto; min-width: 110px; }
.steps { display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); }
.steps i { width: 12px; height: 12px; border: 2px solid var(--border); }
.steps i.done { background: var(--accent); border-color: var(--accent); }
.steps i.on { border-color: var(--accent); background: var(--surface2); }
.qr { align-self: center; text-align: center; color: var(--muted); font-size: 17px; }
.qr canvas { display: block; width: 145px; height: 145px; margin: 0 auto 4px; image-rendering: pixelated; background: #fff; }
.secret { text-align: center; letter-spacing: .12em; }

@media (min-width: 900px) {
  .sidebar { position: static; transform: none; width: 280px; flex: none; transition: none; }
  .scrim, #menu, #team-toggle { display: none !important; }
  .worker { display: flex; width: 120px; --s: 3; }
  .worker[aria-current="true"] { width: 120px; --s: 3; }
  .empty { display: block; }
  .floor { gap: 4px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<section class="login" id="login" aria-labelledby="lg-title">
  <div class="login-card">
    <div class="login-ant"><canvas id="lg-canvas" aria-hidden="true"></canvas></div>
    <h1 id="lg-title">Antlings</h1>
    <p class="sub">Claude Code on your VPS</p>
    <div id="lg-body"></div>
    <div class="lg-msg" id="lg-msg" role="status" aria-live="polite"></div>
    <p class="foot">Demo: any password with 8+ characters, code 123456. Five failures lock sign-in for 15 minutes.</p>
  </div>
</section>


<section class="login" id="firstrun" aria-labelledby="fr-title" hidden>
  <div class="login-card">
    <div class="login-ant"><canvas id="fr-canvas" aria-hidden="true"></canvas></div>
    <h1 id="fr-title">Welcome to Antlings</h1>
    <p class="sub" id="fr-sub"></p>
    <div class="steps" id="fr-steps"></div>
    <div id="fr-body"></div>
    <div class="lg-msg" id="fr-msg" role="status" aria-live="polite"></div>
    <p class="foot" id="fr-foot"></p>
  </div>
</section>

<section class="sec" id="secpage" aria-labelledby="sec-h" hidden>
  <div class="sec-wrap">
    <button class="back" id="sec-back" type="button">← Back to sessions</button>
    <h1 id="sec-h">Security</h1>
    <div id="sec-body"></div>
  </div>
</section>

<div class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Sessions">
    <div class="side-head">
      <h2>Antlings</h2>
      <button class="btn primary" id="new" type="button" aria-label="New session">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>New
      </button>
    </div>
    <div class="filter"><div class="seg" id="seg" role="tablist" aria-label="Session filter"></div></div>
    <div class="sessions" id="list"></div>
    <div class="side-foot">
      <section class="usage" id="usage" aria-label="Plan usage limits"></section>
      <div class="foot-links"><button class="link" id="demo-btn" type="button">Demo</button><button class="link" id="secbtn" type="button">Security</button><button class="link" id="signout" type="button">Sign out</button></div>
    </div>
  </aside>
  <button class="scrim" id="scrim" aria-label="Close sessions" tabindex="-1"></button>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn" id="menu" type="button" aria-label="Open sessions" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="title"></h1>
      <button class="ctxbtn" id="ctxbtn" type="button" aria-expanded="false" aria-controls="ctxpanel"></button>
      <button class="iconbtn danger" id="stop" type="button" aria-label="Interrupt the current turn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
      </button>
      <button class="iconbtn" id="sessbtn" type="button" aria-label="Session actions" aria-haspopup="menu" aria-expanded="false" aria-controls="sessmenu">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><rect x="3" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="17" y="10" width="4" height="4"/></svg>
      </button>
    </header>
    <div class="menu" id="sessmenu" role="menu" hidden></div>
    <div class="ctxpanel" id="ctxpanel" hidden></div>

    <section class="office" id="office" aria-label="Subagents of this session">

  } else if (s === 2) {
    $('fr-title').textContent = 'Create your passkey'; $('fr-sub').textContent = 'This device will ask for Face ID, a fingerprint or a PIN.';
    b.innerHTML = `<div class="fld"><label for="fr-dev">Name this device</label><input id="fr-dev" value="${esc(fr.device)}" autocomplete="off"></div>
      <button class="btn primary wide" id="fr-pk" type="button">${keySvg}Create passkey</button>`;
    focusId = 'fr-pk';
  } else if (s === 3) {
    $('fr-title').textContent = 'Add a fallback'; $('fr-sub').textContent = 'For when your passkey device is out of reach. Needs a password and an authenticator app.';
    b.innerHTML = `<div class="qr"><canvas id="fr-qr" aria-label="Demo QR code, not scannable"></canvas>Demo picture, not scannable</div>
      <div class="secret" aria-label="Setup key">JBSW Y3DP EHPK 3PXP</div>
      <form id="fr-fbform" class="fld" style="gap:12px" novalidate>
        <div class="fld"><label for="fr-pw">Password (12 or more characters)</label><input id="fr-pw" type="password" autocomplete="new-password"></div>
        <div class="fld"><label for="fr-pw2">Repeat password</label><input id="fr-pw2" type="password" autocomplete="new-password"></div>
        <div class="fld"><label for="fr-otp">Code from the app</label><input id="fr-otp" class="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6"></div>
        <button class="btn primary wide" type="submit">Finish setup</button></form>
      <button class="link" data-fr="skip" type="button">Skip for now (passkey only)</button>`;
    drawFakeQR($('fr-qr')); focusId = 'fr-pw';
  } else {
    $('fr-title').textContent = 'Your colony is ready'; $('fr-sub').textContent = sec.fallback.on ? 'Passkey and fallback are set. You are signed in.' : 'Passkey only for now. Add a fallback later in Security.';
    b.innerHTML = `<button class="btn primary wide" data-fr="open" type="button">Open Antlings</button>`; focusId = '';
  }
  if (focusId) setTimeout(() => { const f = $(focusId); if (f && !$('firstrun').hidden) f.focus(); }, 0);
}
function frGo(step) { fr.step = step; renderFirstRun(); }
function showFirstRun() {
  $('login').hidden = true; $('secpage').hidden = true; document.querySelector('.app').hidden = true; $('firstrun').hidden = false;
  sec.passkeys = []; fr.device = 'This device'; frAnt.state = 'idle'; frMsg(''); frGo(1);
}
$('firstrun').addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'fr-codeform') {
    if ($('fr-code').value.trim().toUpperCase() === SETUP_CODE) { frMsg(''); frAnt.state = 'thinking'; setTimeout(() => { frAnt.state = 'idle'; frGo(2); }, 500); }
    else frErr('That code is not valid or has expired.');
  } else if (e.target.id === 'fr-fbform') {
    const pw = $('fr-pw').value, pw2 = $('fr-pw2').value, otp = $('fr-otp').value.replace(/\D/g, '');
    if (pw.length < 12) return frErr('The password needs at least 12 characters.');
    if (pw !== pw2) return frErr("The passwords don't match.");
    if (otp !== DEMO_CODE) return frErr("That code didn't match.");
    sec.fallback.on = true; frMsg(''); frAnt.state = 'done'; frGo(4);
  }
});
$('firstrun').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'fr-pk') {
    fr.device = $('fr-dev').value.trim() || 'This device';
    frMsg('Waiting for your device…'); frAnt.state = 'thinking'; t.disabled = true;
    setTimeout(() => {
      sec.passkeys.unshift({ id: 'pfresh', name: fr.device, added: TODAY, used: 'just now', fresh: true }); addLog('ok', `First passkey "${fr.device}" registered`);
      frMsg(''); frAnt.state = 'idle'; frGo(3);
    }, 1200);
  } else if (t.dataset.fr === 'skip') { sec.fallback.on = false; frMsg(''); frAnt.state = 'done'; frGo(4); }
  else if (t.dataset.fr === 'open') { frAnt.state = 'idle'; showApp(true); }
});
$('demo-first').addEventListener('click', () => { $('demo').close(); showFirstRun(); });
if (/[?&]first\b/.test(location.search)) showFirstRun();

renderAll();
</script>
</body>
