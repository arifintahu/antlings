# Matches the lines the Antlings service writes on a failed sign-in, for example:
#   antlings-auth-fail ip=203.0.113.9 reason=password
# The service strips line breaks from everything it logs, so one failure is one line.
[Definition]
failregex = ^.*\bantlings-auth-fail ip=<HOST> reason=[\w-]+\s*$
ignoreregex =
