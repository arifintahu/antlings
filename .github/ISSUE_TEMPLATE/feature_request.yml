name: Feature request
description: Suggest something Antlings should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: A rough idea is fine. Say who it is for and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
  - type: markdown
    attributes:
      value: |
        Antlings is built for one owner on one small server. Changes to sign-in, the trust boundary or the stack are discussed in an issue first, see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
